services:
  postgres:
    image: postgres:16
    container_name: artilegenz-postgres
    environment:
      POSTGRES_USER: artilegenz
      POSTGRES_PASSWORD: artilegenz_local_dev
      POSTGRES_DB: sap_errors
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/postgres_ddl.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artilegenz -d sap_errors"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
    name: artilegenz_postgres_data
